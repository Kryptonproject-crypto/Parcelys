<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img"
     aria-label="Comparaison du rendu immédiat et du rendu par tuiles : en immédiat, la profondeur et la couleur font trois allers-retours vers la mémoire externe ; en rendu par tuiles, elles restent dans la SRAM de tuile et seule l'image finale sort, ce qui divise le trafic externe par neuf.">
  <title>Rendu immédiat contre rendu par tuiles — le trafic qui disparaît</title>
  <desc>À gauche, le rendu immédiat écrit la profondeur, la relit et écrit la couleur en mémoire externe, soit environ trois cents mégaoctets par image en 4K avec un surdessin de trois. À droite, le rendu par tuiles garde la profondeur et la couleur intermédiaire dans huit kilooctets de SRAM de tuile ; seule l'image finale, environ trente-trois mégaoctets, atteint la mémoire. La suppression des surfaces cachées divise en plus le travail de shading par trois.</desc>

  <rect width="1080" height="660" fill="#FAF9F7"/>

  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BF4E2C"/>
    </marker>
    <marker id="a5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E6B5E"/>
    </marker>
    <marker id="a5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C3C38"/>
    </marker>
  </defs>

  <text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1B1B19">Rendu immédiat contre rendu par tuiles — ce qui disparaît</text>
  <text x="40" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E6E68">Hypothèse commune : 4K (8,3 Mpx), surdessin moyen ×3, 60 Hz, profondeur et couleur sur 4 octets</text>

  <line x1="540" y1="78" x2="540" y2="512" stroke="#C9C7C1" stroke-width="1.4"/>

  <!-- ============ PANNEAU A ============ -->
  <text x="60" y="100" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1B1B19">A — Rendu immédiat</text>

  <rect x="60" y="116" width="440" height="60" fill="#EFEBE4" stroke="#3C3C38" stroke-width="1.6"/>
  <text x="280" y="141" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19" text-anchor="middle">Shading de tous les fragments</text>
  <text x="280" y="160" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6E6E68" text-anchor="middle">25 Mpx shadés par image — y compris ceux qui seront recouverts</text>

  <g stroke="#BF4E2C" stroke-width="2.4" marker-end="url(#a5)" fill="none">
    <line x1="130" y1="176" x2="130" y2="424"/>
    <line x1="280" y1="424" x2="280" y2="180" marker-end="url(#a5)"/>
    <line x1="430" y1="176" x2="430" y2="424"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1B1B19">
    <rect x="76" y="270" width="108" height="36" fill="#FAF9F7"/>
    <text x="130" y="284" text-anchor="middle" font-weight="700">profondeur</text>
    <text x="130" y="298" text-anchor="middle">écriture · 100 Mo</text>
    <rect x="226" y="270" width="108" height="36" fill="#FAF9F7"/>
    <text x="280" y="284" text-anchor="middle" font-weight="700">profondeur</text>
    <text x="280" y="298" text-anchor="middle">lecture · 100 Mo</text>
    <rect x="376" y="270" width="108" height="36" fill="#FAF9F7"/>
    <text x="430" y="284" text-anchor="middle" font-weight="700">couleur</text>
    <text x="430" y="298" text-anchor="middle">écriture · 100 Mo</text>
  </g>

  <rect x="60" y="424" width="440" height="56" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.8"/>
  <text x="280" y="448" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19" text-anchor="middle">Mémoire externe (LPDDR6)</text>
  <text x="280" y="467" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6E6E68" text-anchor="middle">~200 pJ par accès de 32 bits</text>

  <rect x="60" y="500" width="440" height="66" fill="#F7E2D8" stroke="#BF4E2C" stroke-width="1.6"/>
  <text x="280" y="522" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1B19" text-anchor="middle">~300 Mo par image → 18 Go/s à 60 Hz</text>
  <text x="280" y="542" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C3C38" text-anchor="middle">soit plusieurs watts dépensés uniquement à déplacer des pixels,</text>
  <text x="280" y="558" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C3C38" text-anchor="middle">avant même d'avoir affiché quoi que ce soit</text>

  <!-- ============ PANNEAU B ============ -->
  <text x="580" y="100" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1B1B19">B — Rendu par tuiles (défaut Aurora)</text>

  <rect x="580" y="116" width="440" height="40" fill="#EFEBE4" stroke="#3C3C38" stroke-width="1.5"/>
  <text x="800" y="141" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B1B19" text-anchor="middle">Binning : la géométrie est triée par tuile de 32 × 32</text>

  <rect x="580" y="166" width="440" height="46" fill="#E0EBE7" stroke="#2E6B5E" stroke-width="1.8"/>
  <text x="800" y="186" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19" text-anchor="middle">HSR — visibilité résolue exactement, avant le shading</text>
  <text x="800" y="203" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2E6B5E" text-anchor="middle">8,3 Mpx shadés au lieu de 25 : le travail de shading est divisé par 3</text>

  <rect x="580" y="222" width="440" height="56" fill="#EFEBE4" stroke="#3C3C38" stroke-width="1.6"/>
  <text x="800" y="246" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19" text-anchor="middle">Shading des seuls fragments visibles</text>
  <text x="800" y="265" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6E6E68" text-anchor="middle">le poste le plus coûteux du pipeline graphique</text>

  <!-- boucle tampon de tuile -->
  <rect x="640" y="308" width="320" height="56" fill="#E0EBE7" stroke="#2E6B5E" stroke-width="2.2"/>
  <text x="800" y="331" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19" text-anchor="middle">Tampon de tuile — 8 Ko de SRAM</text>
  <text x="800" y="350" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3C3C38" text-anchor="middle">32 × 32 px × (couleur 4 o + profondeur 4 o)</text>

  <path d="M700 278 L700 304" stroke="#2E6B5E" stroke-width="2.4" fill="none" marker-end="url(#a5g)"/>
  <path d="M900 304 L900 282" stroke="#2E6B5E" stroke-width="2.4" fill="none" marker-end="url(#a5g)"/>
  <rect x="716" y="282" width="168" height="18" fill="#FAF9F7"/>
  <text x="800" y="296" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#2E6B5E" text-anchor="middle">profondeur + couleur, sur puce</text>

  <!-- les flèches supprimées -->
  <g stroke="#C9C7C1" stroke-width="2.4" stroke-dasharray="6 5" fill="none">
    <line x1="640" y1="364" x2="640" y2="424"/>
    <line x1="960" y1="364" x2="960" y2="424"/>
  </g>
  <g stroke="#BF4E2C" stroke-width="2.6">
    <line x1="628" y1="386" x2="652" y2="404"/><line x1="652" y1="386" x2="628" y2="404"/>
    <line x1="948" y1="386" x2="972" y2="404"/><line x1="972" y1="386" x2="948" y2="404"/>
  </g>
  <text x="640" y="418" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#9B998F" text-anchor="middle">supprimé</text>
  <text x="960" y="418" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#9B998F" text-anchor="middle">supprimé</text>

  <line x1="800" y1="364" x2="800" y2="424" stroke="#3C3C38" stroke-width="2.6" marker-end="url(#a5d)"/>
  <rect x="726" y="384" width="148" height="18" fill="#FAF9F7"/>
  <text x="800" y="398" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1B1B19" text-anchor="middle">image finale · 33 Mo</text>

  <rect x="580" y="424" width="440" height="56" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.8"/>
  <text x="800" y="448" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19" text-anchor="middle">Mémoire externe (LPDDR6)</text>
  <text x="800" y="467" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6E6E68" text-anchor="middle">même mémoire, même coût par accès</text>

  <rect x="580" y="500" width="440" height="66" fill="#E0EBE7" stroke="#2E6B5E" stroke-width="1.8"/>
  <text x="800" y="522" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1B19" text-anchor="middle">~33 Mo par image → 2 Go/s à 60 Hz</text>
  <text x="800" y="542" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C3C38" text-anchor="middle">trafic externe divisé par 9, travail de shading divisé par 3,</text>
  <text x="800" y="558" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C3C38" text-anchor="middle">pour 8 Ko de SRAM par cœur</text>

  <!-- note -->
  <line x1="40" y1="592" x2="1040" y2="592" stroke="#C9C7C1" stroke-width="1"/>
  <text x="40" y="616" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19">Le prix à payer, qui est réel</text>
  <text x="40" y="636" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3C3C38">Le binning doit traiter toute la géométrie avant de shader, et stocke une liste de primitives par tuile. Sur une scène à géométrie extrême,</text>
  <text x="40" y="653" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3C3C38">cette liste déborde et devient elle-même un poste de trafic. D'où la bascule matérielle vers le mode immédiat, par passe de rendu (§3.3).</text>
</svg>
