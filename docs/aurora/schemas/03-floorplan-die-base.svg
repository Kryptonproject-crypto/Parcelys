<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 800" role="img"
     aria-label="Plan de masse du die de base BASE-D : seize tranches de cache système reliées par un réseau maillé quatre par quatre, un régulateur intégré et une unité near-memory par tranche, les contrôleurs mémoire sur les deux bords, et l'emprise des chiplets logiques superposée en pointillés.">
  <title>BASE-D — plan de masse et emprise des chiplets</title>
  <desc>Le die de base mesure 20,5 sur 20,5 millimètres, soit 420 millimètres carrés en N6. Il porte seize tranches de quatre mégaoctets de cache système, un routeur de réseau maillé et un régulateur de tension intégré par tranche, huit unités near-memory, et huit contrôleurs LPDDR6 répartis sur les bords gauche et droit. Les emprises des cinq chiplets logiques empilés au-dessus sont dessinées en pointillés : chaque régulateur se trouve directement sous le domaine d'alimentation qu'il sert.</desc>

  <rect width="990" height="800" fill="#FAF9F7"/>

  <defs>
    <marker id="d3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6E68"/>
    </marker>
  </defs>

  <text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1B1B19">BASE-D — plan de masse, avec l'emprise des chiplets superposée</text>
  <text x="40" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E6E68">20,5 × 20,5 mm = 420 mm² · N6 · échelle 26 px/mm · le pointillé orange est ce qui se trouve au-dessus, pas dans ce die</text>

  <rect x="150" y="110" width="533" height="533" fill="#F3F1EC" stroke="#1B1B19" stroke-width="2.2"/>

  <!-- PHY gauche -->
  <g>
    <rect x="156" y="116" width="42" height="126" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
    <rect x="156" y="246" width="42" height="126" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
    <rect x="156" y="376" width="42" height="126" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
    <rect x="156" y="506" width="42" height="131" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
  </g>
  <text x="177" y="380" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1B1B19" text-anchor="middle" transform="rotate(-90 177 380)">4 × contrôleur + PHY LPDDR6</text>

  <!-- PHY droite -->
  <g>
    <rect x="635" y="116" width="42" height="126" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
    <rect x="635" y="246" width="42" height="126" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
    <rect x="635" y="376" width="42" height="126" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
    <rect x="635" y="506" width="42" height="131" fill="#E6E5E1" stroke="#3C3C38" stroke-width="1.1"/>
  </g>
  <text x="656" y="380" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1B1B19" text-anchor="middle" transform="rotate(-90 656 380)">4 × contrôleur + PHY LPDDR6</text>

  <!-- grille 4x4 SLC -->
  <g>
    <rect x="206" y="116" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="315" y="116" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="424" y="116" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="533" y="116" width="98"  height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>

    <rect x="206" y="247" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="315" y="247" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="424" y="247" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="533" y="247" width="98"  height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>

    <rect x="206" y="378" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="315" y="378" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="424" y="378" width="105" height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="533" y="378" width="98"  height="127" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>

    <rect x="206" y="509" width="105" height="128" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="315" y="509" width="105" height="128" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="424" y="509" width="105" height="128" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
    <rect x="533" y="509" width="98"  height="128" fill="#FAF9F7" stroke="#6E6E68" stroke-width="1.1"/>
  </g>

  <!-- contenu type d'une cellule, répété -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1B1B19" text-anchor="middle">
    <text x="258" y="138">SLC 4 Mo</text><text x="367" y="138">SLC 4 Mo</text><text x="476" y="138">SLC 4 Mo</text><text x="582" y="138">SLC 4 Mo</text>
    <text x="258" y="269">SLC 4 Mo</text><text x="367" y="269">SLC 4 Mo</text><text x="476" y="269">SLC 4 Mo</text><text x="582" y="269">SLC 4 Mo</text>
    <text x="258" y="400">SLC 4 Mo</text><text x="367" y="400">SLC 4 Mo</text><text x="476" y="400">SLC 4 Mo</text><text x="582" y="400">SLC 4 Mo</text>
    <text x="258" y="531">SLC 4 Mo</text><text x="367" y="531">SLC 4 Mo</text><text x="476" y="531">SLC 4 Mo</text><text x="582" y="531">SLC 4 Mo</text>
  </g>

  <!-- IVR (teal) dans chaque cellule -->
  <g fill="#E0EBE7" stroke="#2E6B5E" stroke-width="1.2">
    <rect x="216" y="204" width="46" height="28"/><rect x="325" y="204" width="46" height="28"/>
    <rect x="434" y="204" width="46" height="28"/><rect x="541" y="204" width="46" height="28"/>
    <rect x="216" y="335" width="46" height="28"/><rect x="325" y="335" width="46" height="28"/>
    <rect x="434" y="335" width="46" height="28"/><rect x="541" y="335" width="46" height="28"/>
    <rect x="216" y="466" width="46" height="28"/><rect x="325" y="466" width="46" height="28"/>
    <rect x="434" y="466" width="46" height="28"/><rect x="541" y="466" width="46" height="28"/>
    <rect x="216" y="598" width="46" height="28"/><rect x="325" y="598" width="46" height="28"/>
    <rect x="434" y="598" width="46" height="28"/><rect x="541" y="598" width="46" height="28"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1B1B19" text-anchor="middle">
    <text x="239" y="222">IVR</text><text x="348" y="222">IVR</text><text x="457" y="222">IVR</text><text x="564" y="222">IVR</text>
    <text x="239" y="353">IVR</text><text x="348" y="353">IVR</text><text x="457" y="353">IVR</text><text x="564" y="353">IVR</text>
    <text x="239" y="484">IVR</text><text x="348" y="484">IVR</text><text x="457" y="484">IVR</text><text x="564" y="484">IVR</text>
    <text x="239" y="616">IVR</text><text x="348" y="616">IVR</text><text x="457" y="616">IVR</text><text x="564" y="616">IVR</text>
  </g>

  <!-- liens du maillage + routeurs -->
  <g stroke="#2E6B5E" stroke-width="1.8" opacity="0.75">
    <line x1="284" y1="170" x2="393" y2="170"/><line x1="393" y1="170" x2="502" y2="170"/><line x1="502" y1="170" x2="605" y2="170"/>
    <line x1="284" y1="301" x2="393" y2="301"/><line x1="393" y1="301" x2="502" y2="301"/><line x1="502" y1="301" x2="605" y2="301"/>
    <line x1="284" y1="432" x2="393" y2="432"/><line x1="393" y1="432" x2="502" y2="432"/><line x1="502" y1="432" x2="605" y2="432"/>
    <line x1="284" y1="563" x2="393" y2="563"/><line x1="393" y1="563" x2="502" y2="563"/><line x1="502" y1="563" x2="605" y2="563"/>
    <line x1="284" y1="170" x2="284" y2="301"/><line x1="284" y1="301" x2="284" y2="432"/><line x1="284" y1="432" x2="284" y2="563"/>
    <line x1="393" y1="170" x2="393" y2="301"/><line x1="393" y1="301" x2="393" y2="432"/><line x1="393" y1="432" x2="393" y2="563"/>
    <line x1="502" y1="170" x2="502" y2="301"/><line x1="502" y1="301" x2="502" y2="432"/><line x1="502" y1="432" x2="502" y2="563"/>
    <line x1="605" y1="170" x2="605" y2="301"/><line x1="605" y1="301" x2="605" y2="432"/><line x1="605" y1="432" x2="605" y2="563"/>
  </g>
  <g fill="#2E6B5E">
    <circle cx="284" cy="170" r="7"/><circle cx="393" cy="170" r="7"/><circle cx="502" cy="170" r="7"/><circle cx="605" cy="170" r="7"/>
    <circle cx="284" cy="301" r="7"/><circle cx="393" cy="301" r="7"/><circle cx="502" cy="301" r="7"/><circle cx="605" cy="301" r="7"/>
    <circle cx="284" cy="432" r="7"/><circle cx="393" cy="432" r="7"/><circle cx="502" cy="432" r="7"/><circle cx="605" cy="432" r="7"/>
    <circle cx="284" cy="563" r="7"/><circle cx="393" cy="563" r="7"/><circle cx="502" cy="563" r="7"/><circle cx="605" cy="563" r="7"/>
  </g>

  <!-- unités near-memory, collées aux PHY -->
  <g fill="#E0EBE7" stroke="#2E6B5E" stroke-width="1.2">
    <rect x="206" y="152" width="40" height="22"/><rect x="206" y="414" width="40" height="22"/>
    <rect x="591" y="152" width="40" height="22"/><rect x="591" y="414" width="40" height="22"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#1B1B19" text-anchor="middle">
    <text x="226" y="166">NM</text><text x="226" y="428">NM</text><text x="611" y="166">NM</text><text x="611" y="428">NM</text>
  </g>

  <!-- emprises des chiplets, en pointillés -->
  <g fill="none" stroke="#BF4E2C" stroke-width="2.4" stroke-dasharray="9 5">
    <rect x="200" y="120" width="224" height="187"/>
    <rect x="430" y="120" width="224" height="187"/>
    <rect x="200" y="316" width="247" height="104"/>
    <rect x="200" y="430" width="244" height="208"/>
    <rect x="452" y="430" width="202" height="208"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#BF4E2C">
    <rect x="248" y="112" width="128" height="17" fill="#FAF9F7"/>
    <text x="312" y="125" text-anchor="middle">CCD-P (au-dessus)</text>
    <rect x="490" y="112" width="104" height="17" fill="#FAF9F7"/>
    <text x="542" y="125" text-anchor="middle">CCD-P</text>
    <rect x="288" y="308" width="72" height="17" fill="#FAF9F7"/>
    <text x="324" y="321" text-anchor="middle">CCD-E</text>
    <rect x="286" y="422" width="72" height="17" fill="#FAF9F7"/>
    <text x="322" y="435" text-anchor="middle">GCD-4</text>
    <rect x="517" y="422" width="72" height="17" fill="#FAF9F7"/>
    <text x="553" y="435" text-anchor="middle">GCD-4</text>
  </g>

  <!-- cotes -->
  <line x1="150" y1="668" x2="683" y2="668" stroke="#6E6E68" stroke-width="1.2" marker-start="url(#d3)" marker-end="url(#d3)"/>
  <rect x="384" y="658" width="66" height="19" fill="#FAF9F7"/>
  <text x="417" y="672" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B1B19" text-anchor="middle" font-weight="700">20,5 mm</text>

  <!-- légende -->
  <text x="716" y="130" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19">Légende</text>
  <circle cx="726" cy="152" r="7" fill="#2E6B5E"/>
  <text x="742" y="156" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3C3C38">routeur NoC (16, maille 4 × 4)</text>
  <rect x="719" y="170" width="16" height="12" fill="#E0EBE7" stroke="#2E6B5E" stroke-width="1.2"/>
  <text x="742" y="180" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3C3C38">IVR, 1 par tranche</text>
  <rect x="719" y="192" width="16" height="12" fill="#E0EBE7" stroke="#2E6B5E" stroke-width="1.2"/>
  <text x="742" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3C3C38">NM : GEMV / réductions près de la mémoire</text>
  <line x1="719" y1="218" x2="735" y2="218" stroke="#BF4E2C" stroke-width="2.4" stroke-dasharray="9 5"/>
  <text x="742" y="222" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3C3C38">emprise d'un chiplet empilé</text>

  <text x="716" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19">Budget de surface</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">
    <text x="716" y="282">SLC 64 Mo (16 tranches)</text><text x="958" y="282" text-anchor="end">29 mm²</text>
    <text x="716" y="300">Capacités de découplage profondes</text><text x="958" y="300" text-anchor="end">72 mm²</text>
    <text x="716" y="318">Champs de TSV d'alimentation</text><text x="958" y="318" text-anchor="end">58 mm²</text>
    <text x="716" y="336">16 IVR</text><text x="958" y="336" text-anchor="end">44 mm²</text>
    <text x="716" y="354">8 contrôleurs + PHY LPDDR6</text><text x="958" y="354" text-anchor="end">38 mm²</text>
    <text x="716" y="372">Répertoire de cohérence</text><text x="958" y="372" text-anchor="end">9 mm²</text>
    <text x="716" y="390">NoC (16 routeurs + liens)</text><text x="958" y="390" text-anchor="end">7 mm²</text>
    <text x="716" y="408">8 unités near-memory</text><text x="958" y="408" text-anchor="end">5 mm²</text>
    <text x="716" y="426">Port UCIe vers l'IOD</text><text x="958" y="426" text-anchor="end">3 mm²</text>
    <text x="716" y="444">Interfaces hybrides, routage, garde</text><text x="958" y="444" text-anchor="end">155 mm²</text>
  </g>
  <line x1="716" y1="454" x2="958" y2="454" stroke="#9B998F" stroke-width="1"/>
  <text x="716" y="472" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1B1B19">Total</text>
  <text x="958" y="472" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1B1B19" text-anchor="end">420 mm²</text>

  <rect x="716" y="492" width="242" height="146" fill="#F7E2D8" stroke="#BF4E2C" stroke-width="1.4"/>
  <text x="728" y="512" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1B1B19">La contrainte qui fixe la taille</text>
  <text x="728" y="530" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">Le die de base ne peut pas être plus petit</text>
  <text x="728" y="545" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">que la somme des chiplets qu'il porte :</text>
  <text x="728" y="560" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">2 × 62 + 38 + 2 × 78 = 318 mm².</text>
  <text x="728" y="578" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">Avec les bords et les bords de découpe,</text>
  <text x="728" y="593" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">cela impose 420 mm². C'est le deuxième</text>
  <text x="728" y="608" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">poste de coût du produit, et c'est ce qui</text>
  <text x="728" y="623" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3C3C38">limite Aurora-S à 2 die de base séparés.</text>

  <!-- note -->
  <line x1="40" y1="700" x2="958" y2="700" stroke="#C9C7C1" stroke-width="1"/>
  <text x="40" y="724" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1B1B19">Ce que le pointillé démontre</text>
  <text x="40" y="744" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3C3C38">Chaque régulateur se trouve à l'aplomb du domaine qu'il alimente : moins de 60 µm séparent la sortie du régulateur de la charge, contre</text>
  <text x="40" y="761" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3C3C38">plusieurs centimètres avec un régulateur de carte. C'est ce qui rend crédible une transition de tension sous 2 µs et un DVFS par cœur.</text>
  <text x="40" y="778" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3C3C38">Le corollaire est thermique : les unités matricielles des CCD-P ne doivent pas se superposer aux tranches SLC les plus sollicitées.</text>
</svg>
