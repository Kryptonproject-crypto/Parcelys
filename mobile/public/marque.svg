<!-- viewBox resserrée sur le dessin : une icône doit remplir son carré, sinon
     elle paraît minuscule à côté des autres dans une barre d'onglets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 26 240 226" role="img" aria-label="Parcelys">
  <title>Parcelys</title>
  <!--
    Marque Parcelys : trois parcelles en perspective isométrique, d'où
    poussent deux feuilles et un épi.

    Redessinée en vectoriel à partir du logo fourni. Le fichier d'origine est
    un rendu lumineux sur fond noir : le halo y est cuit dans l'image et les
    formes sont semi-transparentes, donc inexploitable par découpe — sur fond
    clair il ne restait qu'un carré flou. Les couleurs ci-dessous sont
    relevées au pixel sur ce rendu.

    En vectoriel, la marque reste nette de 16 px (onglet du navigateur) à
    512 px (icône d'application), et se pose sur clair comme sur sombre.
  -->
  <defs>
    <linearGradient id="p-tuile-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6d3a" />
      <stop offset="1" stop-color="#06592f" />
    </linearGradient>
    <linearGradient id="p-tuile-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c8340" />
      <stop offset="1" stop-color="#136b33" />
    </linearGradient>
    <linearGradient id="p-tuile-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccd2b" />
      <stop offset="1" stop-color="#79ab1d" />
    </linearGradient>
    <linearGradient id="p-feuille-g" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f9c4a" />
      <stop offset="1" stop-color="#0f763a" />
    </linearGradient>
    <linearGradient id="p-feuille-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63b23a" />
      <stop offset="1" stop-color="#3d8a2b" />
    </linearGradient>
    <linearGradient id="p-epi" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffc233" />
      <stop offset="1" stop-color="#f5a410" />
    </linearGradient>
  </defs>

  <!--
    Les parcelles s'ouvrent en éventail depuis un point central, comme les
    pages d'un livre posé à plat : deux vers la gauche, une vers la droite.
    C'est de ce point que sortent les plants.
  -->
  <g>
    <!-- Aile gauche, repliée vers le bas. -->
    <path d="M14 168 L120 150 L126 186 L26 210 Z" fill="url(#p-tuile-g)" />
    <!-- Aile centrale, sous le pli. -->
    <path d="M34 214 L128 190 L134 224 L50 240 Z" fill="url(#p-tuile-c)" />
    <!-- Aile droite, plus claire : la parcelle au soleil. -->
    <path d="M136 150 L242 168 L230 206 L134 186 Z" fill="url(#p-tuile-d)" />
    <!-- Sillons : un trait par parcelle suffit à dire « cultivé ». -->
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M32 176 L112 163" />
      <path d="M52 219 L120 202" />
      <path d="M150 163 L228 176" />
    </g>
  </g>

  <!-- Feuille arrière, penchée à gauche, enracinée au pli. -->
  <path
    d="M124 162 C92 140 80 100 96 56 C128 78 140 122 134 160 Z"
    fill="url(#p-feuille-g)"
  />
  <!-- Feuille avant, redressée. -->
  <path
    d="M132 162 C130 118 144 78 168 50 C182 92 172 136 144 162 Z"
    fill="url(#p-feuille-d)"
  />
  <!-- Nervure de la feuille avant. -->
  <path
    d="M138 158 C138 120 148 88 166 60"
    stroke="#ffffff"
    stroke-opacity="0.24"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- L'épi, le plus haut : c'est lui qui porte la lumière. -->
  <path
    d="M176 158 C168 120 176 78 194 40 C212 80 208 126 190 160 Z"
    fill="url(#p-epi)"
  />
  <g stroke="#b97f06" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M182 146 L194 137" />
    <path d="M180 128 L195 118" />
    <path d="M181 108 L196 99" />
    <path d="M185 88 L197 80" />
  </g>
  <path
    d="M186 160 L193 52"
    stroke="#8a5f04"
    stroke-opacity="0.45"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
