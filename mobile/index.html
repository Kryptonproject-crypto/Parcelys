<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` + les encoches : l'application occupe l'écran
         entier, les marges de sécurité sont gérées en CSS. -->

      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1a3d24" />
    <!-- Icône en ligne : la WebView réclame un favicon et l'absence de fichier
         produit une erreur 404 dans la console à chaque démarrage. -->
