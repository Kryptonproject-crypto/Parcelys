name: Intégration continue

# Types, style, et la suite de tests complète — qui a besoin d'un vrai
# PostgreSQL avec PostGIS : les superficies sont calculées par la base, et un
# test qui les simulerait ne prouverait rien.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, style et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parcelys
          POSTGRES_PASSWORD: parcelys
          POSTGRES_DB: parcelys_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parcelys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://parcelys:parcelys@localhost:5432/parcelys_test?schema=public
      TEST_DATABASE_URL: postgresql://parcelys:parcelys@localhost:5432/parcelys_test?schema=public
      # Coût bcrypt minimal : la suite crée des centaines de comptes, et la
      # robustesse du hachage n'est pas ce que ces tests vérifient.
      PASSWORD_HASH_COST: '10'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Migrations
        run: npx prisma migrate deploy

      - name: Types
        run: npm run typecheck

      - name: Style
        run: npx eslint src tests scripts --max-warnings=0

      - name: Compilation
        run: npm run build

      - name: Tests
        run: npx vitest run

  mobile:
    name: Application de terrain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
